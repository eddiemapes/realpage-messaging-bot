[project]
name = "messaging-bot"
version = "0.1.0"
description = "Context-aware message-sending bot that learns from example records"
readme = "README.md"
authors = [
    { name = "Eddie Mapes", email = "1999eddiem@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langfuse>=5.1.0",
    "numpy>=2.5.4",
    "openai>=3.42.1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "typer>=0.27.3",
]

[project.scripts]
messaging-bot = "messaging_bot.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
